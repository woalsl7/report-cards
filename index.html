<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 상반기 안전점검 보고서 · 장별 카드</title>
<meta name="description" content="행정안전부 2026년 상반기 종합 안전점검 보고서를 장별 카드로 보고, 장 사이의 수치 정합성을 확인합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202c; --muted:#556271; --line:#cfd6de; --bg:#f1f3f6; --paper:#fff;
  --brand:#14385c; --bad:#b3261e; --bad-bg:#fbe9e7; --ok:#1e6b43; --ok-bg:#e3f2ea;
  --mark:#ffe58a; --focus:#0b57d0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.7;word-break:keep-all}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

header.top{background:var(--brand);color:#fff}
header.top .wrap{padding-top:48px;padding-bottom:40px}
.org{margin:0 0 10px;font-size:15px;color:#bcd0e6}
h1{margin:0;font-family:"Noto Serif KR",serif;font-weight:900;font-size:clamp(28px,5vw,48px);line-height:1.25;letter-spacing:-.02em}
.alert{margin:22px 0 0;display:inline-flex;gap:10px;align-items:center;background:#fff;color:var(--ink);padding:8px 14px;border-left:6px solid var(--bad);font-size:15px}
.alert a{color:var(--bad);font-weight:700}

.finder{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.finder .wrap{display:flex;gap:12px;align-items:center;padding-top:12px;padding-bottom:12px}
.finder label{font-weight:700;font-size:14px;white-space:nowrap}
.finder input{flex:1;height:46px;border:2px solid var(--line);border-radius:4px;padding:0 12px;font:inherit;font-size:16px;color:var(--ink);min-width:0}
.finder input:focus{border-color:var(--brand)}
.finder button{height:46px;padding:0 16px;border:2px solid var(--brand);background:transparent;color:var(--brand);font:inherit;font-weight:700;border-radius:4px;cursor:pointer}
.finder button:hover{background:var(--brand);color:#fff}
.count{font-weight:700;white-space:nowrap}

main{padding-bottom:20px}
.cards{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--brand);padding:20px 22px 18px;display:flex;flex-direction:column}
.card.flag{border-top-color:var(--bad)}
.card .head{display:flex;align-items:baseline;gap:14px}
.num{font-family:"Noto Serif KR",serif;font-weight:900;font-size:56px;line-height:1;color:var(--brand)}
.card.flag .num{color:var(--bad)}
.ttl{margin:0;font-size:21px;font-weight:700}
.ttl small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.sum{margin:14px 0 0}
.badge{align-self:flex-start;margin-top:12px;font-size:13px;font-weight:700;color:var(--bad);background:var(--bad-bg);padding:1px 10px;border-radius:12px}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--brand)}
details p{margin:10px 0 0;font-size:15px}
strong{font-weight:700}
strong.x{color:var(--bad);text-decoration:underline wavy var(--bad) 1px;text-underline-offset:4px}
mark{background:var(--mark);color:inherit;padding:0 1px}
.empty{margin-top:28px;padding:48px 20px;text-align:center;background:var(--paper);border:1px solid var(--line)}
.empty b{display:block;font-size:20px}

section.matrix{margin-top:56px}
section.matrix h2{margin:0;font-family:"Noto Serif KR",serif;font-size:28px;font-weight:900}
section.matrix .sub{margin:6px 0 20px;color:var(--muted)}
.embed{background:var(--paper);border:1px solid var(--line);margin-bottom:24px}
.embed iframe{display:block;width:100%;height:420px;border:0}
.embed .bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.embed .bar a{color:var(--brand);font-weight:700}
.todo{padding:24px;background:var(--paper);border:2px dashed #8a97a6;margin-bottom:24px}
.todo b{display:block;font-size:18px;margin-bottom:6px}
.todo ol{margin:8px 0 0;padding-left:20px}
.todo code{background:#e8ecf1;padding:1px 6px;border-radius:3px;font-size:14px}
.tbl{overflow-x:auto;background:var(--paper);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:15px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
thead th{background:#f6f8fa;font-size:13px;color:var(--muted)}
tbody th{white-space:nowrap}
td.bad{background:var(--bad-bg);color:var(--bad);font-weight:700}
td.none{color:#8a97a6}
.v{display:inline-block;padding:1px 10px;border-radius:12px;font-weight:700;font-size:13px}
.v.ok{background:var(--ok-bg);color:var(--ok)}
.v.bad{background:var(--bad-bg);color:var(--bad)}
.note{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}
footer{padding:36px 0 60px;color:var(--muted);font-size:13px}
@media (max-width:640px){.finder .wrap{flex-wrap:wrap}.finder label{display:none}.count{width:100%}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <p class="org">행정안전부 안전정책총괄과</p>
    <h1>2026년 상반기<br>종합 안전점검 결과 보고서</h1>
    <p class="alert" id="alert" hidden></p>
  </div>
</header>

<form class="finder" role="search" onsubmit="return false">
  <div class="wrap">
    <label for="q">검색</label>
    <input id="q" type="search" placeholder="제목 또는 본문 키워드 (예: 예산, 450건, 권혁수)" autocomplete="off">
    <button type="button" id="clear">지우기</button>
    <span class="count" id="count" aria-live="polite">결과 0건</span>
  </div>
</form>

<main class="wrap">
  <ul class="cards" id="cards" aria-label="보고서 장별 카드"></ul>
  <div class="empty" id="empty" hidden><b>일치하는 장이 없습니다.</b>다른 키워드로 검색하거나 [지우기]를 눌러 보세요.</div>

  <section class="matrix" id="matrix" aria-labelledby="mh">
    <h2 id="mh">사실 정합성 매트릭스</h2>
    <p class="sub">보고서의 핵심 사실 5가지가 장마다 같은 값으로 쓰였는지 비교했습니다.</p>
    <div id="sheet"></div>
    <div class="tbl">
      <table>
        <caption class="sr">장별 사실 비교표</caption>
        <thead><tr><th scope="col">사실</th><th scope="col">1장</th><th scope="col">2장</th><th scope="col">3장</th><th scope="col">4장</th><th scope="col">5장</th><th scope="col">판정</th></tr></thead>
        <tbody id="mbody"></tbody>
      </table>
    </div>
  </section>
</main>
<footer><div class="wrap">자료: 장데이터.json(5개 장). 빨간색 표시는 다른 장과 값이 다른 수치입니다.</div></footer>

<script>
/* ★ Google Sheets 임베드 주소를 여기에 붙여넣으세요.
   시트: 파일 → 공유 → 웹에 게시 → 임베드 → 링크 복사(…/pubhtml?widget=true&headers=false) */
const SHEET_EMBED_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRjktNDpkFlF576absp3DJkqvYuxP3w1DG7MtHpM2ZFXfdB1CW8yCDy0-6VrvXRW_mwwt-tymuVYMc7/pubhtml";

const CHAPTERS = [{"장": "1", "제목": "개요", "본문": "본 보고서는 행정안전부 안전정책총괄과가 2026년 상반기 실시한 종합 안전점검 결과를 정리한 자료다.\n\n총 점검 건수는 **450건**이며, 지적사항 **120건** 중 시정 완료율은 **85%**이다. 예산 집행률은 **92%**, 총괄책임자는 **권혁수** 안전정책총괄과장이다."}, {"장": "2", "제목": "분야별 결과", "본문": "분야별 점검은 시설안전·교통안전·재난안전·산업안전 4개 분야로 진행됐다. 분야별 총합은 **450건**과 일치한다.\n\n지적사항 **115건** 중 80% 이상이 1분기 내 시정되었으며, 누적 시정 완료율은 **85%**으로 집계됐다. "}, {"장": "3", "제목": "예산 운용", "본문": "상반기 예산 집행률 **90%**은 전년 동기 대비 5%p 상승한 수치다. \n\n총괄 운영은 **권혁수** 과장이 직접 주재했고, 분기별 점검회의 5회를 개최했다."}, {"장": "4", "제목": "향후 계획", "본문": "하반기에는 추가 점검 **440건**을 목표로 추진한다. \n\n상반기 시정 완료율 **82%** 수준에 머문 일부 지자체는 추가 컨설팅 대상으로 지정한다. "}, {"장": "5", "제목": "결론", "본문": "행정안전부 안전정책총괄과는 2026년 상반기 동안 **450건**의 안전점검을 차질 없이 완료했다. 총괄 책임은 **권혁주** 과장이 맡았으며, 향후에도 분기별 점검 체계를 강화한다. "}];

/* 사실 정합성 매트릭스 — v: 값, bad: 다른 장과 값이 다른 셀, ex: 비교에서 제외한 셀(범위가 다름) */
const FACTS = [
  {fact:"점검 건수", cells:{1:{v:"450건"},2:{v:"450건"},4:{v:"440건",ex:"하반기 목표"},5:{v:"450건"}}, ok:true,  note:"4장의 440건은 하반기 목표라 비교에서 제외"},
  {fact:"지적사항",  cells:{1:{v:"120건",bad:1},2:{v:"115건",bad:1}}, ok:false, note:"1장 120건 ↔ 2장 115건"},
  {fact:"시정 완료율", cells:{1:{v:"85%"},2:{v:"85%"},4:{v:"82%",ex:"일부 지자체"}}, ok:true, note:"4장의 82%는 일부 지자체 한정 수치"},
  {fact:"예산 집행률", cells:{1:{v:"92%",bad:1},3:{v:"90%",bad:1}}, ok:false, note:"1장 92% ↔ 3장 90%"},
  {fact:"총괄책임자", cells:{1:{v:"권혁수"},3:{v:"권혁수"},5:{v:"권혁주",bad:1}}, ok:false, note:"5장만 ‘권혁주’로 표기"}
];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

/* 장별로 ‘불일치’ 값 모으기 */
const badByChapter = {};
FACTS.forEach(f => Object.entries(f.cells).forEach(([ch,c]) => {
  if (c.bad) (badByChapter[ch] = badByChapter[ch] || []).push(c.v);
}));

/* 요약 = 본문 첫 문장 */
function summarize(body){
  const first = body.split(/\n\s*\n/)[0].replace(/\*\*/g,"").trim();
  const m = first.match(/^.*?(?:다|요)\.(?=\s|$)/s);
  return (m ? m[0] : first).trim();
}

/* 검색어 하이라이트 (원문 기준으로 나눈 뒤 이스케이프) */
function hl(raw, q){
  if (!q) return esc(raw);
  return raw.split(new RegExp("(" + reEsc(q) + ")", "ig"))
    .map((p,i) => i % 2 ? "<mark>" + esc(p) + "</mark>" : esc(p)).join("");
}
/* **굵게** 처리 + 불일치 값 표시 */
function rich(raw, q, ch){
  return raw.split(/(\*\*.+?\*\*)/g).map(seg => {
    const m = seg.match(/^\*\*(.+?)\*\*$/);
    if (!m) return hl(seg, q);
    const bad = (badByChapter[ch] || []).includes(m[1]);
    return `<strong${bad ? ' class="x" title="다른 장과 값이 다릅니다"' : ""}>${hl(m[1], q)}</strong>`;
  }).join("");
}

function render(){
  const q = $("q").value.trim();
  const ql = q.toLowerCase();
  const list = CHAPTERS.filter(c => !q || (c.제목 + "\n" + c.본문.replace(/\*\*/g,"")).toLowerCase().includes(ql));
  $("count").textContent = `결과 ${list.length}건`;
  $("empty").hidden = list.length > 0;

  $("cards").innerHTML = list.map(c => {
    const sum = summarize(c.본문);
    const nBad = (badByChapter[c.장] || []).length;
    const paras = c.본문.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
    const inBodyOnly = q && !sum.replace(/\*\*/g,"").toLowerCase().includes(ql) && c.본문.replace(/\*\*/g,"").toLowerCase().includes(ql);
    return `<li class="card${nBad ? " flag" : ""}">
      <div class="head"><span class="num" aria-hidden="true">${esc(c.장)}</span>
        <h2 class="ttl"><small>제${esc(c.장)}장</small>${hl(c.제목, q)}</h2></div>
      <p class="sum">${rich(c.본문.split(/\n\s*\n/)[0].trim().match(/^.*?(?:다|요)\.(?=\s|$)/s)?.[0] || sum, q, c.장)}</p>
      ${nBad ? `<span class="badge">다른 장과 다른 수치 ${nBad}</span>` : ""}
      <details${inBodyOnly ? " open" : ""}><summary>본문 전체 보기</summary>
        ${paras.map(p => `<p>${rich(p, q, c.장)}</p>`).join("")}
      </details></li>`;
  }).join("");
}

/* 매트릭스 */
function renderMatrix(){
  $("mbody").innerHTML = FACTS.map(f => {
    const tds = [1,2,3,4,5].map(n => {
      const c = f.cells[n];
      if (!c) return '<td class="none" aria-label="해당 없음">—</td>';
      return `<td${c.bad ? ' class="bad"' : ""}>${esc(c.v)}${c.ex ? `<span class="note">${esc(c.ex)}</span>` : ""}</td>`;
    }).join("");
    return `<tr><th scope="row">${esc(f.fact)}</th>${tds}<td><span class="v ${f.ok ? "ok" : "bad"}">${f.ok ? "✓ 일치" : "! 불일치"}</span><span class="note">${esc(f.note)}</span></td></tr>`;
  }).join("");

  const nBad = FACTS.filter(f => !f.ok).length;
  const a = $("alert");
  a.hidden = false;
  a.innerHTML = `핵심 사실 ${FACTS.length}개 중 <b>${nBad}개</b>가 장마다 다릅니다. <a href="#matrix">매트릭스 보기</a>`;

  if (SHEET_EMBED_URL) {
    const open = SHEET_EMBED_URL.replace(/\/pubhtml.*$/, "/pubhtml");
    $("sheet").innerHTML = `<div class="embed">
      <iframe src="${esc(SHEET_EMBED_URL)}" title="사실 정합성 매트릭스 (Google Sheets)" loading="lazy" referrerpolicy="no-referrer"></iframe>
      <div class="bar"><span>Google Sheets에서 게시된 표입니다.</span><a href="${esc(open)}" target="_blank" rel="noopener">새 탭에서 열기</a></div></div>`;
  } else {
    $("sheet").innerHTML = `<div class="todo"><b>Google Sheets 표가 아직 연결되지 않았습니다.</b>
      <ol><li><code>data/consistency-matrix.csv</code>를 Google Sheets로 가져옵니다.</li>
      <li>파일 → 공유 → 웹에 게시 → [퍼가기] → 링크의 <code>…/pubhtml?widget=true&amp;headers=false</code> 주소를 복사합니다.</li>
      <li><code>index.html</code> 위쪽의 <code>SHEET_EMBED_URL</code> 값에 붙여넣고 다시 배포합니다.</li></ol></div>`;
  }
}

$("q").addEventListener("input", render);
$("clear").addEventListener("click", () => { $("q").value = ""; render(); $("q").focus(); });
renderMatrix();
render();
</script>
</body>
</html>
